name: Python tests and coverage

on:
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".coveragerc"
      - "pytest.ini"
      - "mcpdocs/**"
      - "docs/mcp_parity_manifest.json"
      - "docs/MCP_PARITY_STATUS.md"
      - "site/**"
      - "scripts/generate_pages_companions.py"
      - "ci/rust-deps/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Run tests with branch coverage gate
        run: >-
          python -m pytest
          --cov-fail-under=90
          --ignore=tests/test_parallel_wrapper.py
          --ignore=tests/test_v2_async_serializer.py
          --ignore=tests/test_m90_target_elf_binding.py
          --ignore=tests/test_m90_reproducible_build.py
          --ignore=tests/test_m90_deployment_sealing.py
          --ignore=tests/test_m91_riscv_deployment.py
      - name: Check live CLI-to-MCP parity inventory
        run: python scripts/generate_mcp_parity_manifest.py --check
      - name: Check pinned GitHub Pages publication
        run: python scripts/generate_pages_companions.py --check
      - name: Verify refactor-mode CLI contract
        run: python -m pytest --no-cov tests/test_cli_system.py tests/test_system_orchestrator.py
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  rust-lanes:
    name: Rayon and Tokio strict-offline gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ci/rust-deps/target
          key: cargo-rust-lanes-${{ runner.os }}-${{ hashFiles('ci/rust-deps/Cargo.toml', 'ci/rust-deps/Cargo.lock') }}
          restore-keys: cargo-rust-lanes-${{ runner.os }}-
      - name: Prefetch pinned Rayon and Tokio dependencies
        run: cargo fetch --locked --manifest-path ci/rust-deps/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Run strict-offline Rayon and Tokio gates
        env:
          # Dependencies and sparse-index metadata were populated by cargo fetch;
          # the generated-crate checks must not resolve over the network.
          FORMALSPECGEN_CARGO_OFFLINE: "1"
        run: python -m pytest --no-cov tests/test_parallel_wrapper.py tests/test_v2_async_serializer.py

  sandbox-acceptance:
    name: Real sandbox and OpenJML MCP acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENJML_VERSION: "21.0.27"
      OPENJML_SHA256: "325b93e0133736053cadb536d4dc6c9c6523e104691724135e4e03457188b06d"
      OPENJML_BIN: ${{ github.workspace }}/tools/openjml-dist/openjml
      OPENJML_HOME: ${{ github.workspace }}/tools/openjml-dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install sandbox and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential default-jdk-headless
          python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Cache pinned OpenJML bundle
        id: openjml-cache
        uses: actions/cache@v4
        with:
          path: tools/openjml-dist
          key: openjml-linux-x64-${{ env.OPENJML_VERSION }}-${{ env.OPENJML_SHA256 }}
      - name: Download and verify pinned OpenJML bundle
        if: steps.openjml-cache.outputs.cache-hit != 'true'
        env:
          OPENJML_URL: https://github.com/OpenJML/OpenJML/releases/download/21.0.27/openjml-ubuntu-24.04-21.0.27.zip
        run: |
          archive="$RUNNER_TEMP/openjml.zip"
          curl --fail --location --retry 3 --output "$archive" "$OPENJML_URL"
          echo "$OPENJML_SHA256  $archive" | sha256sum --check --strict
          mkdir -p tools/openjml-dist
          unzip -q "$archive" -d tools/openjml-dist
          chmod +x tools/openjml-dist/openjml tools/openjml-dist/openjml-java
      - name: Check pinned OpenJML installation
        run: test -x "$OPENJML_BIN" && "$OPENJML_BIN" --version
      - name: Permit the provisioned Bubblewrap acceptance profile
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Delegate memory and process controls
        run: |
          sandbox_cgroup="/sys/fs/cgroup/formalspecgen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$sandbox_cgroup"
          echo '+memory +pids' | sudo tee "$sandbox_cgroup/cgroup.subtree_control" >/dev/null
          sudo mkdir "$sandbox_cgroup/runner"
          sudo chown -R "$(id -u):$(id -g)" "$sandbox_cgroup"
          echo "FORMALSPECGEN_CGROUP_ROOT=$sandbox_cgroup" >> "$GITHUB_ENV"
      - name: Run mandatory real sandbox acceptance
        env:
          FORMALSPECGEN_REQUIRE_SANDBOX_ACCEPTANCE: "1"
          FORMALSPECGEN_REQUIRE_OPENJML_MCP_ACCEPTANCE: "1"
        run: |
          # Enter the delegated parent first. Moving between sibling cgroups
          # requires write access at their common ancestor; descendants can
          # then move into the per-execution child cgroups without privilege.
          echo "$$" | sudo tee "$FORMALSPECGEN_CGROUP_ROOT/runner/cgroup.procs" >/dev/null
          exec python -m pytest -q --no-cov \
            tests/test_sandbox_acceptance.py \
            tests/test_mcp_openjml_acceptance.py
      - name: Remove delegated cgroup
        if: always()
        run: |
          sudo rmdir "$FORMALSPECGEN_CGROUP_ROOT/runner" || true
          sudo rmdir "$FORMALSPECGEN_CGROUP_ROOT" || true
