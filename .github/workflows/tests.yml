name: Python tests and coverage

on:
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".coveragerc"
      - "pytest.ini"
      - "ci/rust-deps/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Run tests with branch coverage gate
        run: >-
          python -m pytest
          --cov-fail-under=90
          --ignore=tests/test_parallel_wrapper.py
          --ignore=tests/test_v2_async_serializer.py
      - name: Verify refactor-mode CLI contract
        run: python -m pytest --no-cov tests/test_cli_system.py tests/test_system_orchestrator.py
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  rust-lanes:
    name: Rayon and Tokio offline gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ci/rust-deps/target
          key: cargo-rust-lanes-${{ runner.os }}-${{ hashFiles('ci/rust-deps/Cargo.toml', 'ci/rust-deps/Cargo.lock') }}
          restore-keys: cargo-rust-lanes-${{ runner.os }}-
      - name: Prefetch pinned Rayon and Tokio dependencies
        run: cargo fetch --locked --manifest-path ci/rust-deps/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Run offline Rayon and Tokio gates
        env:
          # GitHub runners have network access but do not reliably retain sparse-index
          # metadata between jobs; versions remain exact through Cargo.lock/--locked.
          FORMALSPECGEN_CARGO_OFFLINE: "0"
        run: python -m pytest --no-cov tests/test_parallel_wrapper.py tests/test_v2_async_serializer.py
