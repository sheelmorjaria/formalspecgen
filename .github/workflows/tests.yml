name: Python tests and coverage

on:
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".coveragerc"
      - "pytest.ini"
      - "mcpdocs/**"
      - "docs/mcp_parity_manifest.json"
      - "docs/MCP_PARITY_STATUS.md"
      - "site/**"
      - "scripts/generate_pages_companions.py"
      - "ci/rust-deps/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Run tests with branch coverage gate
        run: >-
          python -m pytest
          --cov-fail-under=90
          --ignore=tests/test_parallel_wrapper.py
          --ignore=tests/test_v2_async_serializer.py
          --ignore=tests/test_m90_target_elf_binding.py
          --ignore=tests/test_m90_reproducible_build.py
          --ignore=tests/test_m90_deployment_sealing.py
          --ignore=tests/test_m91_riscv_deployment.py
      - name: Check live CLI-to-MCP parity inventory
        run: python scripts/generate_mcp_parity_manifest.py --check
      - name: Check pinned GitHub Pages publication
        run: python scripts/generate_pages_companions.py --check
      - name: Verify refactor-mode CLI contract
        run: python -m pytest --no-cov tests/test_cli_system.py tests/test_system_orchestrator.py
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  rust-lanes:
    name: Rayon and Tokio strict-offline gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ci/rust-deps/target
          key: cargo-rust-lanes-${{ runner.os }}-${{ hashFiles('ci/rust-deps/Cargo.toml', 'ci/rust-deps/Cargo.lock') }}
          restore-keys: cargo-rust-lanes-${{ runner.os }}-
      - name: Prefetch pinned Rayon and Tokio dependencies
        run: cargo fetch --locked --manifest-path ci/rust-deps/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt -e .
      - name: Run strict-offline Rayon and Tokio gates
        env:
          # Dependencies and sparse-index metadata were populated by cargo fetch;
          # the generated-crate checks must not resolve over the network.
          FORMALSPECGEN_CARGO_OFFLINE: "1"
        run: python -m pytest --no-cov tests/test_parallel_wrapper.py tests/test_v2_async_serializer.py

  mcp-parity-acceptance:
    name: MCP transport and parity acceptance
    runs-on: ubuntu-latest
    needs: [test, sandbox-acceptance]
    timeout-minutes: 15
    env:
      FORMALSPECGEN_REQUIRE_MCP_TRANSPORT_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-mcp.txt
            pyproject.toml
      - name: Install pinned MCP acceptance dependencies
        run: >-
          python -m pip install --upgrade pip
          -r requirements-dev.txt
          -r requirements-mcp.txt
          -e .
      - name: Download provisioned workflow acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: provisioned-mcp-acceptance-${{ github.sha }}
          path: build
      - name: Derive the evidence-backed parity report
        run: >-
          python scripts/generate_mcp_parity_manifest.py
          --acceptance-evidence build/mcp-acceptance-evidence.json
          --manifest build/mcp-parity-manifest.json
          --status build/MCP_PARITY_STATUS.md
          --require-complete inspect
          --require-complete document-code
          --require-complete verify
      - name: Publish revision-bound parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-parity-acceptance-${{ github.sha }}
          path: |
            build/mcp-acceptance-evidence.json
            build/mcp-parity-manifest.json
            build/MCP_PARITY_STATUS.md
            build/mcp-acceptance-artifacts/
          if-no-files-found: error
          retention-days: 90

  sandbox-acceptance:
    name: Real sandbox and polyglot verifier acceptance
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    env:
      OPENJML_VERSION: "21.0.27"
      OPENJML_SHA256: "325b93e0133736053cadb536d4dc6c9c6523e104691724135e4e03457188b06d"
      OPENJML_BIN: ${{ github.workspace }}/tools/openjml-dist/openjml
      OPENJML_HOME: ${{ github.workspace }}/tools/openjml-dist
      PRUSTI_VERSION: "2024-03-26-1504"
      PRUSTI_SHA256: "1f504aa6b26169e8438c9e98624f800c20a6193a997df19768b28d8173b35057"
      KANI_VERSION: "0.67.0"
      KANI_SHA256: "3b5f7afd3b51603ee720db7bc1bc4fe46b5a4f5d36daad9939c4b4c658b51ac0"
      FRAMAC_VERSION: "33.0-Arsenic"
      FRAMAC_SHA256: "c754c31bb32d151acf7db3bcfdc5181b076bdbff813b19049e984f639eba3735"
      RUSTC_BIN: /usr/bin/rustc
      PRUSTI_BIN: ${{ github.workspace }}/tools/prusti/prusti-rustc
      CC_BIN: /usr/bin/gcc
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local verifier paths
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/formalspecgen-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/formalspecgen-cargo" >> "$GITHUB_ENV"
          echo "KANI_BIN=$RUNNER_TEMP/kani/kani-${KANI_VERSION}/bin/kani-driver" >> "$GITHUB_ENV"
          echo "FRAMAC_BIN=$RUNNER_TEMP/frama-package/bin/frama-c" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install sandbox and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:esbmc/esbmc
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential default-jdk-headless \
            esbmc rustc z3
          python -m pip install --upgrade pip -r requirements-dev.txt \
            -r requirements-mcp.txt -e .
      - name: Cache pinned OpenJML bundle
        id: openjml-cache
        uses: actions/cache@v4
        with:
          path: tools/openjml-dist
          key: openjml-linux-x64-${{ env.OPENJML_VERSION }}-${{ env.OPENJML_SHA256 }}
      - name: Download and verify pinned OpenJML bundle
        if: steps.openjml-cache.outputs.cache-hit != 'true'
        env:
          OPENJML_URL: https://github.com/OpenJML/OpenJML/releases/download/21.0.27/openjml-ubuntu-24.04-21.0.27.zip
        run: |
          archive="$RUNNER_TEMP/openjml.zip"
          curl --fail --location --retry 3 --output "$archive" "$OPENJML_URL"
          echo "$OPENJML_SHA256  $archive" | sha256sum --check --strict
          mkdir -p tools/openjml-dist
          unzip -q "$archive" -d tools/openjml-dist
          chmod +x tools/openjml-dist/openjml tools/openjml-dist/openjml-java
      - name: Check pinned OpenJML installation
        run: test -x "$OPENJML_BIN" && "$OPENJML_BIN" --version
      - name: Cache pinned native verifier bundles
        uses: actions/cache@v4
        with:
          path: |
            tools/prusti
            ${{ runner.temp }}/kani
            ${{ runner.temp }}/frama-package
            ${{ runner.temp }}/formalspecgen-rustup
          key: polyglot-verifiers-${{ runner.os }}-${{ env.PRUSTI_VERSION }}-${{ env.KANI_VERSION }}-${{ env.FRAMAC_VERSION }}
      - name: Download and verify pinned native verifier bundles
        run: |
          if [ ! -x "$PRUSTI_BIN" ]; then
            archive="$RUNNER_TEMP/prusti.zip"
            curl --fail --location --retry 3 \
              --output "$archive" \
              "https://github.com/viperproject/prusti-dev/releases/download/v-${PRUSTI_VERSION}/prusti-release-ubuntu.zip"
            echo "$PRUSTI_SHA256  $archive" | sha256sum --check --strict
            mkdir -p tools/prusti
            python -m zipfile -e "$archive" tools/prusti
            chmod +x tools/prusti/prusti-*
          fi
          if [ ! -x "$KANI_BIN" ]; then
            archive="$RUNNER_TEMP/kani.tar.gz"
            curl --fail --location --retry 3 \
              --output "$archive" \
              "https://github.com/model-checking/kani/releases/download/kani-${KANI_VERSION}/kani-${KANI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            echo "$KANI_SHA256  $archive" | sha256sum --check --strict
            mkdir -p "$RUNNER_TEMP/kani"
            tar -xzf "$archive" -C "$RUNNER_TEMP/kani"
          fi
          if [ ! -x "$FRAMAC_BIN" ]; then
            archive="$RUNNER_TEMP/frama-c.run"
            curl --fail --location --retry 3 \
              --output "$archive" \
              "https://www.frama-c.com/download/frama-c-linux-x86-64-${FRAMAC_VERSION}.run"
            echo "$FRAMAC_SHA256  $archive" | sha256sum --check --strict
            chmod +x "$archive"
            mkdir -p "$RUNNER_TEMP/frama-package"
            "$archive" --noexec --target "$RUNNER_TEMP/frama-package"
          fi
      - name: Install Prusti's pinned Rust toolchain
        run: |
          mkdir -p "$CARGO_HOME/bin"
          cp "$(command -v rustup)" "$CARGO_HOME/bin/rustup"
          ln -sf rustup "$CARGO_HOME/bin/rustc"
          ln -sf rustup "$CARGO_HOME/bin/cargo"
          "$CARGO_HOME/bin/rustup" toolchain install nightly-2023-09-15 --profile minimal \
            --component rustc-dev --component llvm-tools-preview \
            --component rust-std
          kani_toolchain="$(cat "$(dirname "$(dirname "$KANI_BIN")")/rust-toolchain-version")"
          "$CARGO_HOME/bin/rustup" toolchain install "$kani_toolchain" --profile minimal
          ln -sfnT "$RUSTUP_HOME/toolchains/$kani_toolchain" \
            "$(dirname "$(dirname "$KANI_BIN")")/toolchain"
          "$PRUSTI_BIN" --version
          "$KANI_BIN" --version
          "$FRAMAC_BIN" -version
          esbmc --version
      - name: Permit the provisioned Bubblewrap acceptance profile
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Delegate memory and process controls
        run: |
          sandbox_cgroup="/sys/fs/cgroup/formalspecgen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$sandbox_cgroup"
          echo '+memory +pids' | sudo tee "$sandbox_cgroup/cgroup.subtree_control" >/dev/null
          sudo mkdir "$sandbox_cgroup/runner"
          sudo chown -R "$(id -u):$(id -g)" "$sandbox_cgroup"
          echo "FORMALSPECGEN_CGROUP_ROOT=$sandbox_cgroup" >> "$GITHUB_ENV"
      - name: Run mandatory real sandbox acceptance
        env:
          FORMALSPECGEN_REQUIRE_SANDBOX_ACCEPTANCE: "1"
          FORMALSPECGEN_REQUIRE_OPENJML_MCP_ACCEPTANCE: "1"
          FORMALSPECGEN_REQUIRE_MCP_TRANSPORT_ACCEPTANCE: "1"
        run: |
          # Enter the delegated parent first. Moving between sibling cgroups
          # requires write access at their common ancestor; descendants can
          # then move into the per-execution child cgroups without privilege.
          echo "$$" | sudo tee "$FORMALSPECGEN_CGROUP_ROOT/runner/cgroup.procs" >/dev/null
          exec python -m pytest -q --no-cov \
            tests/test_sandbox_acceptance.py \
            tests/test_mcp_openjml_acceptance.py
      - name: Produce provisioned MCP workflow acceptance evidence
        env:
          FORMALSPECGEN_REQUIRE_MCP_TRANSPORT_ACCEPTANCE: "1"
        run: |
          echo "$$" | sudo tee "$FORMALSPECGEN_CGROUP_ROOT/runner/cgroup.procs" >/dev/null
          exec python scripts/run_mcp_acceptance.py \
            --command inspect \
            --command document-code \
            --command verify \
            --evidence build/mcp-acceptance-evidence.json
      - name: Upload provisioned MCP workflow acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: provisioned-mcp-acceptance-${{ github.sha }}
          path: |
            build/mcp-acceptance-evidence.json
            build/mcp-acceptance-artifacts/
          if-no-files-found: error
          retention-days: 1
      - name: Remove delegated cgroup
        if: always()
        run: |
          sudo rmdir "$FORMALSPECGEN_CGROUP_ROOT/runner" || true
          sudo rmdir "$FORMALSPECGEN_CGROUP_ROOT" || true
