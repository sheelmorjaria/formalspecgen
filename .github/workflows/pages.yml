name: Publish user guide

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mcpdocs/mcp_parity_plan.json"
      - "scripts/generate_pages_companions.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Validate current and archived guide assets
        run: |
          test -f site/index.html
          test -f site/command_inventory.json
          test -f site/mcp_capabilities.json
          test -f site/VALIDATION.md
          test -f site/archive/91c6790/index.html
          test -f site/archive/91c6790/command_inventory.json
          test -f site/archive/91c6790/VALIDATION.md
          python scripts/generate_pages_companions.py --check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
