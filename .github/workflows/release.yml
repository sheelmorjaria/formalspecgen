name: Release FormalSpecGen CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build twine -r requirements-dev.txt -e .
      - name: Run deterministic test suite
        run: >-
          python -m pytest
          --cov-fail-under=90
          --ignore=tests/test_parallel_wrapper.py
          --ignore=tests/test_v2_async_serializer.py
          --ignore=tests/test_m90_target_elf_binding.py
          --ignore=tests/test_m90_reproducible_build.py
          --ignore=tests/test_m90_deployment_sealing.py
          --ignore=tests/test_m91_riscv_deployment.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Record distribution checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: formalspecgen-python
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formalspecgen-python
          path: release-assets
      - name: Attach Python distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
