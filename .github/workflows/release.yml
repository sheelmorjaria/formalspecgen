name: Release FormalSpecGen CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build -r requirements-dev.txt
      - name: Run deterministic test suite
        run: python -m pytest -c pytest.ini
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: formalspecgen-python
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: formalspecgen-python
          path: release-assets
      - name: Attach Python distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
