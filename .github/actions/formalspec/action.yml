name: FormalSpec JML Check
description: Validate changed Java/JML files and publish GitHub Checks annotations
inputs:
  base:
    description: Base git ref used to discover changed files
    required: false
    default: HEAD^
  mode:
    description: OpenJML mode (check or esc)
    required: false
    default: check
  report:
    description: Path for the structured JSON verification report
    required: false
    default: formalspec-report.json
runs:
  using: composite
  steps:
    - name: Validate changed formal specifications
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pipeline.ci \
          --base "${{ inputs.base }}" \
          --mode "${{ inputs.mode }}" \
          --report "${{ inputs.report }}"
