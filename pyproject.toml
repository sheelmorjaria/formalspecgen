[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formalspecgen"
dynamic = ["version"]
description = "Human-in-the-loop neuro-symbolic formal specification and verification"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sheel Morjaria" }]
dependencies = [
  "javalang==0.13.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "prompt-toolkit>=3.0.51,<4",
  "rich>=14.1,<15",
]

[project.scripts]
formalspecgen = "pipeline.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["pipeline*", "formalspec_core*"]

[tool.setuptools.dynamic]
version = { attr = "pipeline.__version__" }
