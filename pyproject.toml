[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formalspecgen"
dynamic = ["version"]
description = "Human-in-the-loop neuro-symbolic formal specification and verification"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sheel Morjaria" }]
dependencies = [
  "javalang==0.13.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "prompt-toolkit>=3.0.51,<4",
  "rich>=14.1,<15",
  "tree-sitter==0.26.0",
  "tree-sitter-java==0.23.5",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4",
  "llvmlite>=0.44",
]

[project.scripts]
formalspecgen = "pipeline.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["pipeline*", "formalspec_core*"]

[tool.setuptools]
include-package-data = true
py-modules = ["mcp_server"]

[tool.setuptools.data-files]
security = ["security/cwe_manifest.json", "security/java_custom.yml", "security/c_custom.yml"]
domains = ["domains/*.yaml"]
"domains/v2" = ["domains/v2/*.json"]
"ci/rust-deps" = ["ci/rust-deps/Cargo.toml", "ci/rust-deps/Cargo.lock"]
"ci/rust-deps/src" = ["ci/rust-deps/src/lib.rs"]

[tool.setuptools.dynamic]
version = { attr = "pipeline.__version__" }
