schema_version: 2
review_status: unreviewed
domain_name: RateLimiter
module_name: rate_limiter
actors: 1
state_variables:
  - kind: int
    name: tokens
    bound: [0, 5]
    initial: 5
operations:
  - name: handleRequest
    return_type: void
    failure_semantics: unavailable
    guards:
      - id: guard_tokens_positive
        expression:
          kind: gt
          left: {kind: field, name: tokens}
          right: {kind: integer, value: 0}
    effects:
      - id: effect_consume_token
        target: tokens
        value:
          kind: sub
          left: {kind: field, name: tokens}
          right: {kind: integer, value: 1}
    frame: [tokens]
    exception_type: null
    exception_trigger: null
  - name: refill
    return_type: void
    failure_semantics: unavailable
    guards:
      - id: guard_not_full
        expression:
          kind: lt
          left: {kind: field, name: tokens}
          right: {kind: integer, value: 5}
    effects:
      - id: effect_refill
        target: tokens
        value: {kind: integer, value: 5}
    frame: [tokens]
    exception_type: null
    exception_trigger: null
tlc_invariants:
  - id: token_bounds
    expression:
      kind: and
      left:
        kind: gte
        left: {kind: field, name: tokens}
        right: {kind: integer, value: 0}
      right:
        kind: lte
        left: {kind: field, name: tokens}
        right: {kind: integer, value: 5}
