[package]
name = "formalkernel-unikernel"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
unikernel = []

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
