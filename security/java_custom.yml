rules:
  - id: CWE-22-PATH-TRAVERSAL
    languages: [java]
    severity: ERROR
    message: "Potential Path Traversal. User input passed to File API."
    patterns:
      - pattern: new File($INPUT)
      - pattern-not: new File("constant_string")

  - id: CWE-502-DESERIALIZATION
    languages: [java]
    severity: ERROR
    message: "Deserialization of untrusted data."
    pattern: $STREAM.readObject(...)

  - id: CWE-327-WEAK-CRYPTO
    languages: [java]
    severity: WARNING
    message: "Use of broken or risky cryptographic algorithm (MD5/SHA1/DES)."
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA1")
          - pattern: Cipher.getInstance("DES")

  - id: CWE-209-EXCEPTION-EXPOSURE
    languages: [java]
    severity: WARNING
    message: "Exception detail may be exposed to an external caller."
    pattern-either:
      - pattern: return $E.getMessage();
      - pattern: $RESPONSE.sendError(..., $E.getMessage());

  - id: CWE-78-COMMAND-INJECTION
    languages: [java]
    severity: ERROR
    message: "Potential OS command injection. User input passed to Runtime.exec()."
    patterns:
      - pattern: Runtime.getRuntime().exec($INPUT)
      - pattern-not: Runtime.getRuntime().exec("constant_string")

  - id: CWE-79-XSS-CONCATENATION
    languages: [java]
    severity: ERROR
    message: "Potential XSS: untrusted value concatenated into HTML output."
    patterns:
      - pattern-either:
          - pattern: $RESPONSE.getWriter().print($HTML + $INPUT)
          - pattern: $RESPONSE.getWriter().write($HTML + $INPUT)

  - id: CWE-326-WEAK-RSA-KEY
    languages: [java]
    severity: ERROR
    message: "RSA key size is below the recommended 2048-bit minimum."
    pattern-either:
      - pattern: $GEN.initialize(1024)
      - pattern: $GEN.initialize(512)

  - id: CWE-732-WORLD-WRITABLE-PERMISSIONS
    languages: [java, c, cpp]
    severity: ERROR
    message: "Potentially insecure world-writable file permissions."
    pattern-either:
      - pattern: Files.createFile($PATH, ..., PosixFilePermissions.fromString("rwxrwxrwx"), ...)
      - pattern: chmod($PATH, 0777)

  - id: CWE-798-HARDCODED-CREDENTIALS
    languages: [java]
    severity: ERROR
    message: Hard-coded credential assigned to a password/secret/token field.
    patterns:
      - pattern: $TYPE $FIELD = $VALUE;
      - metavariable-regex:
          metavariable: $FIELD
          regex: (?i).*(password|passwd|secret|token|apikey|api_key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^"[^"]+"$

  - id: CWE-330-INSECURE-RANDOMNESS
    languages: [java]
    severity: WARNING
    message: Insecure random source used; security decisions need SecureRandom.
    pattern-either:
      - pattern: new java.util.Random(...)
      - pattern: Math.random()
